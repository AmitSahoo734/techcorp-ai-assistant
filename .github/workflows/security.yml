name: AI Application Security Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # ── GATE 1: Bandit SAST ────────────────────────────────────
  # Scans Python source for insecure code patterns (eval, exec,
  # hardcoded passwords, SQL injection sinks, etc.)
  # Fails pipeline on any HIGH severity finding.
  bandit-sast:
    name: "Gate 1 — Bandit SAST"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (fail on HIGH severity)
        run: bandit -r . -lll --exclude ./.git,./venv,./env,./ai-lab,./project4-mcp

  # ── GATE 2: Safety Dependency Scan ────────────────────────
  # Checks requirements.txt against the Safety CVE database.
  # Fails pipeline on any Critical or High CVE.
  safety-dependency-scan:
    name: "Gate 2 — Safety Dependency Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Safety
        run: pip install safety

      - name: Run Safety scan
        run: safety scan -r requirements.txt

  # ── GATE 3: Gitleaks Secret Detection ─────────────────────
  # Scans the full git history and current diff for secrets.
  # Fails pipeline if any secret pattern is matched.
  gitleaks-secret-scan:
    name: "Gate 3 — Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── GATE 4: Custom Prompt Injection Scanner ────────────────
  # Runs inject_scanner.py to detect hardcoded system prompts
  # and injection bypass phrases in the Python source.
  prompt-injection-scan:
    name: "Gate 4 — Prompt Injection Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run custom injection scanner
        run: python inject_scanner.py