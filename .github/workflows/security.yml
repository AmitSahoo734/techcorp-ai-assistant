# security.yml
# ─────────────────────────────────────────────────────────────
# TechCorp AI Assistant — DevSecOps Security Pipeline
# Runs on every push to any branch.
# 4 sequential gates must all pass before code is considered deployable.
# ─────────────────────────────────────────────────────────────

name: AI Application Security Gates

on:
  push:
    branches: ["**"]   # triggers on push to every branch
  pull_request:
    branches: ["**"]

jobs:

  # ── GATE 1: Bandit SAST ────────────────────────────────────
  # Scans Python source for insecure code patterns (eval, exec,
  # hardcoded passwords, SQL injection sinks, etc.)
  # Fails pipeline on any HIGH severity finding.
  bandit-sast:
    name: "Gate 1 — Bandit SAST"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (fail on HIGH severity)
        # -r  = recursive scan of entire repo
        # -ll = only report Medium and above (-lll for High only)
        # We use -ll here and check exit code; bandit exits non-zero
        # if issues are found at or above the specified level.
        run: bandit -r . -ll --exclude ./.git,./venv,./env,./ai-lab

  # ── GATE 2: Safety Dependency Scan ────────────────────────
  # Checks requirements.txt against the Safety CVE database.
  # Fails pipeline on any Critical or High CVE.
  safety-dependency-scan:
    name: "Gate 2 — Safety Dependency Scan"
    runs-on: ubuntu-latest
    needs: bandit-sast   # only runs if Gate 1 passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check
        # Scans requirements.txt for known CVEs.
        # Exit code 64 = vulnerabilities found (treated as failure).
        run: safety check -r requirements.txt

  # ── GATE 3: Gitleaks Secret Detection ─────────────────────
  # Scans the full git history and current diff for secrets:
  # API keys, passwords, tokens, private keys, etc.
  # Fails pipeline if any secret pattern is matched.
  gitleaks-secret-scan:
    name: "Gate 3 — Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    needs: safety-dependency-scan   # only runs if Gate 2 passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── GATE 4: Custom Prompt Injection Scanner ────────────────
  # Runs inject_scanner.py to detect hardcoded system prompts
  # and injection bypass phrases in the Python source.
  # Fails pipeline (exit code 1) if any match is found.
  prompt-injection-scan:
    name: "Gate 4 — Prompt Injection Scanner"
    runs-on: ubuntu-latest
    needs: gitleaks-secret-scan   # only runs if Gate 3 passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run custom injection scanner
        run: python inject_scanner.py